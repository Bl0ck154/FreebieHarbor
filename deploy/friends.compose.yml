# Optional separate service: invite-only accounts, no account automation.
name: freebieharbor-friends
services:
  portal:
    image: ghcr.io/bl0ck154/freebieharbor:v0.5.1
    container_name: freebieharbor-friends
    command: ["python3", "/app/friends/portal.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; from urllib.parse import urlsplit; from urllib.request import Request,urlopen; urlopen(Request('http://127.0.0.1:8088/health',headers={'Host':urlsplit(os.environ['FRIENDS_PUBLIC_ORIGIN']).netloc}),timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "127.0.0.1:18084:8088"
    environment:
      FRIENDS_DB: "/friends-data/friends.db"
      HUB_DB: "/hubdata/giveaways.db"
      FRIENDS_HOST: "0.0.0.0"
      FRIENDS_PORT: "8088"
      FRIENDS_PUBLIC_ORIGIN: "${FRIENDS_PUBLIC_ORIGIN:-http://127.0.0.1:18084}"
      FRIENDS_COOKIE_SECURE: "${FRIENDS_COOKIE_SECURE:-false}"
    volumes:
      - friends-data:/friends-data
      - type: bind
        source: ${FRIENDS_CATALOG_DIR:-../friends-public-data}
        target: /hubdata
        read_only: true
    mem_limit: 128m
    cpus: 0.2
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
volumes:
  friends-data:
