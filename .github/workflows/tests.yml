name: Python checks
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/steam-qr/requirements-broker.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app/hub.py friends/portal.py tools/friends_admin.py tools/asf_freepackages_profile.py tools/export_friends_catalog.py tools/provision_friends_asf.py friends/qr_broker.py tools/steam-qr/native_bootstrap.py tools/steam-qr/account_context.py tools/steam-qr/offboard.py
