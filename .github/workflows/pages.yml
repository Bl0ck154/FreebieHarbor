name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - docs/assets/dashboard.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build static artifact
        run: |
          mkdir -p _site/assets
          cp -a docs/site/. _site/
          cp docs/assets/dashboard.png _site/assets/dashboard.png
          test -s _site/index.html
          test -s _site/assets/dashboard.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
