name: Publish Docker image (GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag, such as v0.3.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate release reference
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-${RELEASE_TAG}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vX.Y.Z tags are published as latest" >&2
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Verify tag matches application version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import ast
          from pathlib import Path
          module = ast.parse(Path("app/hub.py").read_text())
          version = next(
              node.value.value for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(x, ast.Name) and x.id == "APP_VERSION" for x in node.targets)
          )
          assert "v" + version == os.environ["TAG"], "release tag / APP_VERSION mismatch"
          PY
      - name: Build verified release source
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: docker build --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" .
      - name: Authenticate with registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
